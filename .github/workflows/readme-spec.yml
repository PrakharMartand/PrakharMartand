name: readme.spec

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/**
      - .github/workflows/readme-spec.yml

permissions:
  contents: write

concurrency:
  group: readme-spec
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Run the suite (fetch GitHub data, render README, SVGs and site data)
        run: node scripts/build.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional personal token so private and org contributions count. See TEMPLATE.md.
          README_SPEC_TOKEN: ${{ secrets.README_SPEC_TOKEN }}

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data docs/data.js docs/index.html .github/ISSUE_TEMPLATE
          git diff --cached --quiet && exit 0
          git commit -m "readme.spec: refresh GitHub stats"
          git push
