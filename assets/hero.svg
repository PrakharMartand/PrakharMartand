<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="336" viewBox="0 0 1000 336" role="img" aria-label="Prakhar Martand — SDET @ Prophecy  ·  ex-SDET Consultant @ Harness">
<style>
  .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace} .sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
  .in{animation:in .45s cubic-bezier(.2,.7,.2,1) both}
  .fade{animation:fade .35s ease both}
  .swap-out{animation:swapout .01s linear both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes swapout{from{opacity:1}to{opacity:0}}
  @keyframes blink{50%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}.swap-out{opacity:0}}

    .ov{opacity:0;animation:ov 9s ease-in-out infinite}
    @keyframes ov{0%{opacity:0}4%{opacity:1}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
    .grad{animation:hue 8s linear infinite}
    @keyframes hue{50%{filter:hue-rotate(35deg)}}
    @media (prefers-reduced-motion: reduce){.ov0{opacity:1}}
  </style>
<defs>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".045"/></pattern>
  <clipPath id="win"><rect width="1000" height="336" rx="14"/></clipPath>
</defs>
<g clip-path="url(#win)">
  <rect width="1000" height="336" fill="#0b0f14"/>
  <rect width="1000" height="336" fill="url(#dots)"/>
  <rect width="1000" height="40" fill="#121a23"/>
  <line x1="0" y1="40.5" x2="1000" y2="40.5" stroke="#1f2a37"/>
  <circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
  <text x="500" y="25" text-anchor="middle" class="mono" font-size="13" fill="#8b95a3">prakharmartand@readme.spec — inspector</text>
  
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#3ddc97"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
  <style>#t56_86{animation:t56_86 0.53s steps(20) 0.20s both}
    @keyframes t56_86{from{transform:translateX(0)}to{transform:translateX(186px)}}</style>
  <text x="56" y="86" class="mono" font-size="14" font-weight="400" fill="#4b5563">// system under test</text>
  <rect id="t56_86" x="54" y="72" width="186" height="22" fill="#0b0f14"/>
  <text x="56" y="160" class="sans in grad" style="animation-delay:0.70s" font-size="58" font-weight="800" letter-spacing="-1" fill="url(#g)">Prakhar Martand</text>
  <text x="56" y="211" class="mono in" style="animation-delay:1.00s" font-size="16" fill="#dbe2ea">SDET @ Prophecy  ·  ex-SDET Consultant @ Harness</text>
  <text x="56" y="252" class="sans in" style="animation-delay:1.30s" font-size="17" fill="#8b95a3">I break things for a living, so your users don't have to.</text>
  <g class="in" style="animation-delay:2.00s">
    <rect x="44" y="283" width="620" height="30" rx="7" fill="#0f151c" stroke="#1f2a37"/>
    <text x="58" y="303" class="mono" font-size="13" fill="#60a5fa" font-weight="700">⌖ Locator</text>
    <line x1="140" y1="289" x2="140" y2="307" stroke="#1f2a37"/>
  </g>
  <g class="ov ov0" style="animation-delay:2.4s">
    <rect x="44" y="110" width="482" height="66" rx="6" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="517" y="167" width="9" height="9" rx="2" fill="#60a5fa"/>
    <text x="150" y="303" class="mono" font-size="13" fill="#dbe2ea">getByRole('heading', { name: 'Prakhar Martand' })</text>
  </g>
<g class="ov ov1" style="animation-delay:5.4s">
    <rect x="44" y="190" width="490" height="30" rx="6" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="525" y="211" width="9" height="9" rx="2" fill="#60a5fa"/>
    <text x="150" y="303" class="mono" font-size="13" fill="#dbe2ea">getByText('SDET @ Prophecy')</text>
  </g>
<g class="ov ov2" style="animation-delay:8.4s">
    <rect x="44" y="231" width="446" height="30" rx="6" fill="#60a5fa" fill-opacity=".12" stroke="#60a5fa" stroke-width="1.5"/>
    <rect x="481" y="252" width="9" height="9" rx="2" fill="#60a5fa"/>
    <text x="150" y="303" class="mono" font-size="13" fill="#dbe2ea">getByTestId('tagline')</text>
  </g>
  
  <g class="in" style="animation-delay:1.60s">
    <rect x="684" y="70" width="284" height="243" rx="10" fill="#0f151c" stroke="#1f2a37"/>
    <text x="700" y="96" class="mono" font-size="12" fill="#8b95a3">ASSERTIONS</text>
    <circle cx="948" cy="92" r="4" fill="#3ddc97"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <g class="in" style="animation-delay:2.60s">
      <rect x="698" y="114" width="256" height="46" rx="8" fill="#3ddc97" fill-opacity=".07" stroke="#3ddc97" stroke-opacity=".35"/>
      <text x="712" y="142" class="mono" font-size="14" fill="#3ddc97" font-weight="700">✓</text>
      <text x="732" y="142" class="mono" font-size="12.5"><tspan fill="#8b95a3">expect(me).</tspan><tspan fill="#dbe2ea">toBeVisible()</tspan></text>
    </g><g class="in" style="animation-delay:5.60s">
      <rect x="698" y="176" width="256" height="46" rx="8" fill="#3ddc97" fill-opacity=".07" stroke="#3ddc97" stroke-opacity=".35"/>
      <text x="712" y="204" class="mono" font-size="14" fill="#3ddc97" font-weight="700">✓</text>
      <text x="732" y="204" class="mono" font-size="12.5"><tspan fill="#8b95a3">expect(me).</tspan><tspan fill="#dbe2ea">toHaveText('SDET')</tspan></text>
    </g><g class="in" style="animation-delay:8.60s">
      <rect x="698" y="238" width="256" height="46" rx="8" fill="#3ddc97" fill-opacity=".07" stroke="#3ddc97" stroke-opacity=".35"/>
      <text x="712" y="266" class="mono" font-size="14" fill="#3ddc97" font-weight="700">✓</text>
      <text x="732" y="266" class="mono" font-size="12.5"><tspan fill="#8b95a3">expect(me).</tspan><tspan fill="#dbe2ea">toBeHireable()</tspan></text>
    </g>
  </g>
  
</g>
<rect x=".5" y=".5" width="999" height="335" rx="14" fill="none" stroke="#1f2a37"/>
</svg>
